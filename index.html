<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<!-- No user-scalable=no: page zoom stays available for reading. The map
     blocks it on its own surface with touch-action and handles pinch itself.
     viewport-fit=cover hands the page the notch and home-bar areas; the CSS
     keeps chrome clear of them with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131519" media="(prefers-color-scheme: dark)">
<meta name="description" content="MindRoot: mind maps written in plain Markdown, kept on your device, offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MindRoot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>MindRoot</title>
<!-- Runs before any stylesheet so the first paint already has the chosen
     theme (a dark-theme reader must never see a white flash) and the chosen
     transparency (and the system's cursor, when asked for). Storage can throw in private windows: then the system
     preference decides, which is also the default. -->
<script>
(function () {
  var root = document.documentElement;
  var theme = null;
  var prefs = null;
  try { theme = window.localStorage.getItem('mindroot2:theme'); } catch (e) { theme = null; }
  try { prefs = JSON.parse(window.localStorage.getItem('mindroot2:prefs') || 'null'); } catch (e) { prefs = null; }
  if (theme === 'light' || theme === 'dark') {
    root.setAttribute('data-theme', theme);
    var color = theme === 'dark' ? '#131519' : '#fbfbfc';
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
    var scheme = document.querySelector('meta[name="color-scheme"]');
    if (scheme) scheme.setAttribute('content', theme);
  }
  var p = prefs && prefs.prefs;
  if (p && p.reduceTransparency === true) root.setAttribute('data-transparency', 'reduce');
  if (p && p.sidebarOpen === false) root.setAttribute('data-sidebar', 'closed');
  if (p && p.appCursor === false) root.setAttribute('data-cursor', 'system');
})();
</script>
